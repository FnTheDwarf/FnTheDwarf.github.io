@media (prefers-reduced-motion:no-preference){.btn,.opt,.big{transition:border-color .12s,background .12s}}

const mem={};
const LS={
 get(k,d){try{const v=localStorage.getItem('pcp:'+k);if(v!=null)return JSON.parse(v)}catch(e){} return (k in mem)?mem[k]:d},
 set(k,v){mem[k]=v;try{localStorage.setItem('pcp:'+k,JSON.stringify(v))}catch(e){}},
 del(k){delete mem[k];try{localStorage.removeItem('pcp:'+k)}catch(e){}},
 clear(){Object.keys(mem).forEach(k=>delete mem[k]);try{Object.keys(localStorage).filter(k=>k.indexOf('pcp:')===0).forEach(k=>localStorage.removeItem(k))}catch(e){}}
};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const x=a[i];a[i]=a[j];a[j]=x}return a}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dateEs(d){try{return new Date(d+'T12:00:00Z').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})}catch(e){return d}}
function hm(ts){try{return new Date(ts).toLocaleString('es-CL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,28)}
function rtoken(n){const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copiado')}catch(e){const b=document.getElementById('copybox');if(b){b.value=text;b.focus();b.select();toast('Selecciona y copia el texto')}else toast('No se pudo copiar')}}

 const v=DEMO.find(x=>x.id===vid);
 FIX[vid]=FIX_RAW[vid].map((r,i)=>{
  const ans={};v.crit.forEach((c,j)=>{ans[c.id]=r[2][j]});
  return {id:r[0],name:r[1],ans:ans,rec:r[3],text:r[4],job:r[5],reveal:r[6],fixture:true,pos:i,ts:Date.UTC(2026,9,12,13,0)+i*5.1e6};
 });
});
function allVacs(){return DEMO.concat(LS.get('vacs',[]))}
function getVac(id){return allVacs().find(v=>v.id===id)}
function crits(v){return v.crit.map(c=>({id:c.id,t:c.t,b:BANK[c.id]}))}
function applicants(v){return (FIX[v.id]||[]).concat(LS.get('posts',[]).filter(p=>p.vacId===v.id))}
function evalA(a,v){return crits(v).map(c=>{const o=c.b.opts.find(o=>o[0]===a.ans[c.id]);return {id:c.id,t:c.t,label:c.b.label,ans:o?o[1]:'Sin responder',ok:!!(o&&o[2])}})}
function apto(a,v){return evalA(a,v).every(x=>x.ok)}
function cumple(a,v){const e=evalA(a,v);const ob=e.filter(x=>x.t==='ob'),de=e.filter(x=>x.t==='de');
 return {ob:ob.filter(x=>x.ok).length,obN:ob.length,de:de.filter(x=>x.ok).length,deN:de.length}}
function motives(a,v){const out=[];crits(v).forEach(c=>{const o=c.b.opts.find(o=>o[0]===a.ans[c.id]);const ok=o&&o[2];
  if(!ok&&c.t==='ob')out.push('necesitábamos '+c.b.miss+'.');});
 crits(v).forEach(c=>{const o=c.b.opts.find(o=>o[0]===a.ans[c.id]);const ok=o&&o[2];
  if(!ok&&c.t==='de')out.push('priorizamos a '+c.b.pri+'.');});
 return out.concat(GENERIC)}
function waLink(a,msg){let d=String(a.phone||'').replace(/\D/g,'');if(d.length===9&&d[0]==='9')d='56'+d;
 return 'https://wa.me/'+d+'?text='+encodeURIComponent(msg)}

function bsOf(ctx){
 let s=LS.get('bs:'+ctx.key,null);const ids=applicants(ctx.vac).map(a=>a.id);
 if(!s){const seed=ctx.test?hash(G.T.code+ctx.vac.id):Math.floor(Math.random()*4e9);s={seed:seed,dec:{},motive:{},sent:{},viewed:{},i:0,changes:0}}
 if(!s.rand)s.rand=shuffle(ids,s.seed);

 s.order=ids;return s}

const CVdb={mem:{},
 open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('pcp',1);r.onupgradeneeded=()=>r.result.createObjectStore('cv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},

 async get(id){if(this.mem[id])return this.mem[id];try{const d=await this.open();return await new Promise((res,rej)=>{const r=d.transaction('cv').objectStore('cv').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch(e){return null}},
 async del(id){delete this.mem[id];try{const d=await this.open();await new Promise((res)=>{const tx=d.transaction('cv','readwrite');tx.objectStore('cv').delete(id);tx.oncomplete=res;tx.onerror=res})}catch(e){}}

function pdfEsc(s){return String(s).replace(/[^\x20-\xFF]/g,'-').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}

/* Genera un PDF real y simple con los datos del CV ficticio */
function genPdf(a){
 let y=790;const ops=[];
 const txt=(s,size,font,dy,gray)=>{y-=dy;ops.push((gray==null?'0':gray)+' g BT /'+font+' '+size+' Tf 56 '+y+' Td ('+pdfEsc(s)+') Tj ET')};
 const rule=()=>{ops.push('0.75 G 0.5 w 56 '+(y-5)+' m 539 '+(y-5)+' l S')};
 const sec=(t)=>{txt(t,9,'F2',34,0.4);rule()};
 txt(a.name,24,'F2',0);txt('Currículum',10,'F1',20,0.4);
 sec('EXPERIENCIA');wrapTxt(a.job,78).forEach(l=>txt(l,11,'F1',20));
 const ol=cvLines(a);if(ol.length){sec('OTROS DATOS');ol.forEach(l=>txt(l,11,'F1',20))}
 if(a.rec){sec('REFERENCIA');wrapTxt('Recomendado/a por '+a.rec+'.',78).forEach(l=>txt(l,11,'F1',20))}
 y=44;txt('Documento de ejemplo de la demo. Datos ficticios.',8,'F1',0,0.5);
 const content=ops.join('\n'),objs=[];
 objs[1]='<< /Type /Catalog /Pages 2 0 R >>';objs[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
 objs[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> >>';
 objs[4]='<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream';
 objs[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
 objs[6]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
 let out='%PDF-1.4\n';const offs=[];for(let i=1;i<=6;i++){offs[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n'}
 const x=out.length;out+='xref\n0 7\n0000000000 65535 f \n'+offs.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size 7 /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';
 const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u;
}

  if(doc.numPages>n){const t=document.createElement('div');t.className='hint';t.style.padding='8px 12px';t.textContent='Se muestran las primeras '+n+' páginas de '+doc.numPages+'. Descarga el PDF para verlo completo.';el.appendChild(t)}

function cieTab(ctx,s){

 let h='<p class="mut small">Todas las personas reciben una respuesta con motivo. Tú presionas enviar en tu chat.</p>';
 h+='<div class="row sp"><span class="small"><b>'+sentN+' de '+apl.length+'</b> respuestas enviadas</span><div class="bar" style="width:40%"><i style="width:'+Math.round(100*sentN/apl.length)+'%"></i></div></div>';
 if(ent.length){h+='<h3>A entrevistar</h3>'+ent.map(a=>{const msg=inviteMsg(a,v);return '<div class="card"><div class="row sp"><b>'+esc(a.name)+'</b>'+(s.sent[a.id]?'<span class="chip ok">Enviado</span>':'')+'</div><div class="quote small" style="margin:8px 0">'+esc(msg)+'</div><div class="row wrapx"><a class="btn sm p" href="'+esc(waLink(a,msg))+'" target="_blank" rel="noopener">Abrir mensaje en el chat</a><button class="btn sm" data-act="sent" data-id="'+esc(a.id)+'">'+(s.sent[a.id]?'Desmarcar':'Marcar enviado')+'</button></div></div>'}).join('')}
 h+='<h3>Cerrar con motivo ('+rest.length+')</h3>';
 h+=rest.map(a=>{const ms=motives(a,v),mi=Math.min(s.motive[a.id]||0,ms.length-1),msg=closeMsg(a,v,ms[mi]);
  return '<div class="card"><div class="row sp"><b>'+esc(a.name)+'</b>'+(s.sent[a.id]?'<span class="chip ok">Enviado</span>':'')+'</div>'+
  '<label class="lab" for="m-'+esc(a.id)+'" style="margin-top:8px">Motivo</label><select class="field" id="m-'+esc(a.id)+'" data-act="motive" data-id="'+esc(a.id)+'">'+ms.map((m,i)=>'<option value="'+i+'" '+(i===mi?'selected':'')+'>'+esc(m.charAt(0).toUpperCase()+m.slice(1))+'</option>').join('')+'</select>'+
  '<div class="quote small" style="margin:8px 0">'+esc(msg)+'</div><div class="row wrapx"><a class="btn sm p" href="'+esc(waLink(a,msg))+'" target="_blank" rel="noopener">Abrir mensaje en el chat</a><button class="btn sm" data-act="sent" data-id="'+esc(a.id)+'">'+(s.sent[a.id]?'Desmarcar':'Marcar enviado')+'</button></div></div>'}).join('');
 h+='<div class="note">Se abre tu chat con la persona y el mensaje ya escrito. Las fichas de ejemplo no tienen teléfono real, así que el chat se abre sin destinatario.</div>';
 h+='<button class="btn block" data-act="nav" data-n="surveyEmp">Contar cómo fue decidir · 2 min</button>';
 return h;
}

  const posts=LS.get('posts',[]);const old=posts.findIndex(p=>p.id===F.id);
  const rec=F.recName.trim()?(F.recName.trim()+(F.recRel.trim()?', '+F.recRel.trim():'')):null;
  const rowp={id:F.id,vacId:F.vacId,name:F.name.trim(),phone:F.phone.trim(),ans:F.ans,text:F.text.trim(),rec:rec,cv:F.cv||null,ts:old>=0?posts[old].ts:Date.now(),edited:old>=0?Date.now():null,pos:99};
  if(old>=0)posts[old]=rowp;else posts.push(rowp);LS.set('posts',posts);
  LS.del('draft:'+F.vacId);F.step=4;F.sentAt=rowp.ts;F.err='';render();window.scrollTo(0,0)},
 editFicha(){const F=G.F;const p=LS.get('posts',[]).find(x=>x.id===F.id);if(!p)return;
  const rn=(p.rec||'').split(', ');G.F={vacId:p.vacId,id:p.id,step:1,ans:p.ans,text:p.text,recName:rn[0]||'',recRel:rn.slice(1).join(', '),name:p.name,phone:p.phone,cv:p.cv||null,consent:true};saveDraft();render();window.scrollTo(0,0)},
 newVac(){newCtor()},
 cstep(d){const C=G.C,to=+d.s;
  if(to>C.step){if(C.step===1&&(!C.company.trim()||!C.role.trim())){C.err='Escribe el nombre del local y el cargo.';render();return}
   if(C.step===2){const n=critCounts(C);if(n.ob<1){C.err='Elige al menos un criterio obligatorio.';render();return}}}
  C.err='';C.step=to;render();window.scrollTo(0,0)},
 setCrit(d){const C=G.C,n=critCounts(C),cur=C.crit[d.c]||'';
  if(d.t==='ob'&&cur!=='ob'&&n.ob>=3){C.err='Máximo 3 obligatorios.';render();return}
  if(d.t==='de'&&cur!=='de'&&n.de>=2){C.err='Máximo 2 deseables.';render();return}
  C.err='';if(d.t)C.crit[d.c]=d.t;else delete C.crit[d.c];render()},
 setQ(d){G.C.qi=+d.i;render()},
 publishVac(){const C=G.C;const cr=Object.keys(BANK).filter(k=>C.crit[k]).sort((a,b)=>(C.crit[a]==='ob'?0:1)-(C.crit[b]==='ob'?0:1)).map(k=>({id:k,t:C.crit[k]}));
  if(!cr.length){C.err='Elige al menos un criterio.';render();return}
  const id='v'+Date.now().toString(36);
  const v={id:id,code:C.company.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]/g,'').slice(0,3).toUpperCase()||'VAC',company:C.company.trim(),comuna:C.comuna.trim()||'Santiago',role:C.role.trim(),schedule:C.schedule.trim()||'A convenir',crit:cr,q:QBANK[C.qi],deadline:C.deadline,slug:slug(C.company+' '+C.role),token:rtoken(16)};
  const vs=LS.get('vacs',[]);vs.push(v);LS.set('vacs',vs);C.done=v;C.step=4;render();window.scrollTo(0,0)},
 openBand(d){openBand(d.v)},
 tab(d){G.V.tab=d.t;G.V.cvOpen=null;render();window.scrollTo(0,0)},
 nav1(d){const ctx=getCtx(),s=bsOf(ctx);s.i=Math.max(0,Math.min(s.rand.length-1,s.i+(+d.d)));saveBs(ctx,s);G.V.cvOpen=null;render();window.scrollTo(0,0)},
 dec(d){const ctx=getCtx(),s=bsOf(ctx);setDec(ctx,s,d.id,d.d);
  const inList=modeOf(ctx)==='list';
  if(!d.stay&&!inList){const idx=s.rand.indexOf(d.id);let nx=-1;for(let k=1;k<=s.rand.length;k++){const j=(idx+k)%s.rand.length;if(!s.dec[s.rand[j]]){nx=j;break}}s.i=nx>=0?nx:idx;saveBs(ctx,s);G.V.cvOpen=null}
  render();if(!inList)window.scrollTo(0,0)},
 mode(d){const ctx=getCtx();G.V.mode=d.m;G.V.cvOpen=null;logEv(ctx,'mode:'+d.m,'');render()},
 openFocus(d){const ctx=getCtx(),s=bsOf(ctx);s.i=Math.max(0,s.rand.indexOf(d.id));saveBs(ctx,s);G.V.mode='focus';G.V.cvOpen=null;render();window.scrollTo(0,0)},
 cvToggle(d){const ctx=getCtx();G.V.cvOpen=G.V.cvOpen===d.id?null:d.id;if(G.V.cvOpen){logEv(ctx,'cv:view',d.id);markViewed(ctx,bsOf(ctx),d.id)}render()},
 dl(d){dlCv(d.id)},
 rmCv(){CVdb.del(G.F.id);G.F.cv=null;saveDraft();render()},
 toggleEnt(d){const ctx=getCtx(),s=bsOf(ctx);const on=s.dec[d.id]==='ent';
  if(on)setDec(ctx,s,d.id,ctx.test&&ctx.cond==='ctrl'?'':'pre');else{if(entCount(s)>=3)return;setDec(ctx,s,d.id,'ent')}
  if(s.dec[d.id]==='')delete s.dec[d.id],saveBs(ctx,s);render()},
 motive(d,el){const ctx=getCtx(),s=bsOf(ctx);s.motive[d.id]=+el.value;saveBs(ctx,s);render()},
 sent(d){const ctx=getCtx(),s=bsOf(ctx);if(s.sent[d.id])delete s.sent[d.id];else s.sent[d.id]=Date.now();saveBs(ctx,s);render()},
 scale(d){G.SV[d.k]=+d.v;render()},
 choice(d){G.SV[d.k]=d.v;render()},
 sendSurvey(d){
  if(d.k==='post'){if(!G.SV.p1||!G.SV.p2||!G.SV.p3){toast('Responde las tres primeras preguntas');return}
   saveSurvey({kind:'post',vacId:G.F&&G.F.vacId,p1:G.SV.p1,p2:G.SV.p2,p3:G.SV.p3,p4:G.SV.p4||''});G.SV.donePost=1}
  else{if(!G.SV.e1||!G.SV.e2||!G.SV.e3||!G.SV.e4){toast('Responde las cuatro primeras preguntas');return}
   saveSurvey({kind:'emp',vacId:G.lastVac||null,e1:G.SV.e1,e2:G.SV.e2,e3:G.SV.e3,e4:G.SV.e4,e5:G.SV.e5||''});G.SV.doneEmp=1}
  render();window.scrollTo(0,0)},
 beginTest(){startTest(G.SV.tcode)},
 resumeTest(){const T=G.T;go(T.step==='brief'?'testBrief':T.step==='work'?'work':T.step==='after'?'testAfter':T.step==='final'?'testFinal':'testDone')},
 beginTask(){const t=curTask();LS.del('bs:'+t.key);t.start=Date.now();t.log=[['0','start','']];G.T.step='work';saveT();go('work')},
 finishTask(){const t=curTask(),v=getVac(t.vacId);t.end=Date.now();t.m=metrics(t,v);logEv({test:true,task:t},'finish','');G.T.step='after';G.SV.c1=0;G.SV.c2=0;G.SV.c3='';G.SV.cErr='';saveT();go('testAfter')},
 afterTask(){if(!G.SV.c1||!G.SV.c2){G.SV.cErr='Responde las dos preguntas con una nota de 1 a 5.';render();return}
  const t=curTask();t.conf=G.SV.c1;t.fac=G.SV.c2;t.com=G.SV.c3||'';G.SV.cErr='';
  if(G.T.ti+1<G.T.tasks.length){G.T.ti++;G.T.step='brief';saveT();go('testBrief')}else{G.T.step='final';saveT();go('testFinal')}},
 finishTest(){if(!G.SV.f1){G.SV.fErr='Elige una opción.';render();return}
  G.T.final={pref:G.SV.f1,com:G.SV.f2||''};G.T.step='done';saveT();
  const res=LS.get('results',[]);res.push(JSON.parse(resultLine(G.T)));LS.set('results',res);go('testDone')},
 copyRes(){copy(resultLine(G.T))},
 recalc(){render()},
 exportLocal(){copy(JSON.stringify({posts:LS.get('posts',[]),surveys:LS.get('surveys',[]),results:LS.get('results',[])}))}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;const fn=ACT[el.dataset.act];if(fn&&!el.disabled){e.preventDefault();fn(el.dataset,el)}});
async function handleCv(f){const F=G.F;if(!f||!F)return;
 if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){F.err='El archivo debe ser un PDF.';render();return}
 if(f.size>3*1024*1024){F.err='El PDF pesa más de 3 MB.';render();return}
 const buf=await f.arrayBuffer();
 if(String.fromCharCode.apply(null,new Uint8Array(buf.slice(0,5)))!=='%PDF-'){F.err='El archivo no parece un PDF válido.';render();return}
 await CVdb.put(F.id,buf);F.cv={name:f.name.slice(0,60),size:f.size};F.err='';saveDraft();render()}
document.addEventListener('change',e=>{const el=e.target;if(el.id==='fcv'){handleCv(el.files&&el.files[0]);return}if(el.tagName==='SELECT'&&el.dataset.act&&ACT[el.dataset.act])ACT[el.dataset.act](el.dataset,el)});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.bind;if(!k)return;
 const p=k.split('.');G[p[0]][p[1]]=e.target.value;
 if(k==='F.text'){const c=document.getElementById('cnt');if(c)c.textContent=e.target.value.length}
 if(p[0]==='F')saveDraft();});
render();

})();
</script>
